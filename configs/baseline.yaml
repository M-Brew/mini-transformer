
seed: 42

model:
  vocab_size: null
  block_size: 256
  n_layer: 4
  n_head: 4
  n_embd: 256
  dropout: 0.1

training:
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 10000
  eval_interval: 250
  gradient_clip: 1.0

data:
  input_path: data/raw/corpus.txt
  train_path: data/processed/train.pt
  validation_path: data/processed/validation.pt
  validation_fraction: 0.1

generation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
